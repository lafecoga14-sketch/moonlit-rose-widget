
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moonlit Rose | Moon Phase</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #775967;
    color: #F4F1EC;
    font-family: Georgia, serif;
  }

  .widget {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 16px;
    width: 100%;
    min-height: 124px;
  }

  .moon-art {
    width: 90px;
    height: 90px;
    flex-shrink: 0;
  }

  .details {
    min-width: 0;
    flex: 1;
  }

  .phase {
    font-size: clamp(17px, 5vw, 22px);
    line-height: 1.2;
    margin-bottom: 10px;
  }

  .illumination {
    color: #DDC6C4;
    font-size: 14px;
  }

  .signature {
    color: #D4CDD0;
    font-size: 11px;
    letter-spacing: 1px;
    margin-top: 12px;
  }

  @media (max-width: 260px) {
    .widget { gap: 10px; padding: 14px 10px; }
    .moon-art { width: 68px; height: 68px; }
    .phase { font-size: 16px; }
    .illumination { font-size: 12px; }
  }
</style>
</head>

<body>
<div class="widget">

  <svg class="moon-art" viewBox="0 0 100 100"
       role="img" aria-label="Current moon phase">
    <defs>
      <radialGradient id="moonSurface"
        cx="65%" cy="35%" r="70%">
        <stop offset="0%" stop-color="#F4F1EC"/>
        <stop offset="70%" stop-color="#D9DDE0"/>
        <stop offset="100%" stop-color="#87838F"/>
      </radialGradient>

      <clipPath id="moonCircle">
        <circle cx="50" cy="50" r="44"/>
      </clipPath>

      <mask id="lightMask"
        maskUnits="userSpaceOnUse"
        x="0" y="0" width="100" height="100">
        <rect width="100" height="100" fill="black"/>
        <path id="litShape" fill="white"/>
      </mask>
    </defs>

    <!-- Dark lunar disk -->
    <circle cx="50" cy="50" r="44" fill="#30252F"/>

    <!-- Illuminated lunar surface -->
    <g mask="url(#lightMask)" clip-path="url(#moonCircle)">
      <circle cx="50" cy="50" r="44"
              fill="url(#moonSurface)"/>

      <!-- Subtle lunar texture -->
      <g fill="#87838F" opacity="0.28">
        <circle cx="66" cy="30" r="12"/>
        <circle cx="39" cy="40" r="7"/>
        <circle cx="70" cy="68" r="14"/>
        <circle cx="43" cy="70" r="10"/>
        <circle cx="56" cy="52" r="5"/>
        <circle cx="28" cy="60" r="6"/>
      </g>

      <g fill="#F4F1EC" opacity="0.22">
        <circle cx="62" cy="28" r="5"/>
        <circle cx="72" cy="66" r="6"/>
        <circle cx="43" cy="69" r="4"/>
      </g>
    </g>
  </svg>

  <div class="details">
    <div class="phase" id="phase">Moon Phase</div>
    <div class="illumination" id="illumination">
      Calculating illumination...
    </div>
    <div class="signature">☾ Moonlit Rose</div>
  </div>

</div>

<script>
  // Approximate lunar cycle.
  const SYNODIC_MONTH = 29.530588853;
  const REFERENCE = Date.UTC(2000, 0, 6, 18, 14);

  function updateMoon() {
    const elapsedDays =
      (Date.now() - REFERENCE) / 86400000;

    const age =
      ((elapsedDays % SYNODIC_MONTH) +
        SYNODIC_MONTH) % SYNODIC_MONTH;

    const fraction = age / SYNODIC_MONTH;

    const illumination =
      (1 - Math.cos(2 * Math.PI * fraction)) / 2;

    const names = [
      "New Moon",
      "Waxing Crescent",
      "First Quarter",
      "Waxing Gibbous",
      "Full Moon",
      "Waning Gibbous",
      "Last Quarter",
      "Waning Crescent"
    ];

    const index =
      Math.floor(fraction * 8 + 0.5) % 8;

    document.getElementById("phase").textContent =
      names[index];

    document.getElementById("illumination").textContent =
      Math.round(illumination * 100) +
      "% illumination";

    // Draw the illuminated portion of the moon.
    const radius = 44;
    const cx = 50;
    const cy = 50;

    const waxing = fraction < 0.5;

    // Terminator position determines the crescent
    // or gibbous shape.
    const terminator =
      Math.cos(2 * Math.PI * fraction);

    const points = [];

    // Right edge for waxing, left edge for waning.
    for (let i = 0; i <= 100; i++) {
      const angle =
        -Math.PI / 2 + Math.PI * i / 100;

      const x = cx +
        (waxing ? 1 : -1) *
        radius * Math.cos(angle);

      const y = cy + radius * Math.sin(angle);

      points.push([x, y]);
    }

    // Return along the illuminated boundary.
    for (let i = 100; i >= 0; i--) {
      const angle =
        -Math.PI / 2 + Math.PI * i / 100;

      const x = cx +
        (waxing ? -1 : 1) *
        radius * terminator * Math.cos(angle);

      const y = cy + radius * Math.sin(angle);

      points.push([x, y]);
    }

    const path = points.map((point, i) =>
      (i === 0 ? "M" : "L") +
      point[0].toFixed(2) + "," +
      point[1].toFixed(2)
    ).join(" ") + " Z";

    document.getElementById("litShape")
      .setAttribute("d", path);
  }

  updateMoon();
  setInterval(updateMoon, 60 * 60 * 1000);
</script>
</body>
</html>
