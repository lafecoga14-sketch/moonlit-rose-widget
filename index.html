
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moonlit Rose | Botanical Date</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #F4F1EC;
      font-family: Georgia, "Times New Roman", serif;
      color: #775967;
    }

    .widget {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      min-height: 155px;
      padding: 16px 14px 16px 20px;
      overflow: hidden;
    }

    .date-content {
      min-width: 0;
      flex: 1;
      position: relative;
      z-index: 1;
    }

    .weekday {
      font-family: Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 2px;
      font-weight: 500;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .date {
      font-size: clamp(35px, 9vw, 53px);
      line-height: 1.05;
      letter-spacing: -1.5px;
      white-space: nowrap;
    }

    .message {
      margin-top: 14px;
      color: #B28F95;
      font-size: 12px;
      font-style: italic;
      white-space: nowrap;
    }

    .botanical {
      width: 95px;
      height: 128px;
      flex-shrink: 0;
    }

    @media (max-width: 290px) {
      .widget {
        padding-left: 12px;
        padding-right: 8px;
      }

      .weekday {
        font-size: 11px;
      }

      .date {
        font-size: 34px;
      }

      .message {
        font-size: 10px;
      }

      .botanical {
        width: 70px;
        height: 110px;
      }
    }
  </style>
</head>

<body>
  <div class="widget">

    <div class="date-content">
      <div class="weekday" id="weekday">WEDNESDAY</div>
      <div class="date" id="date">Nov 18</div>
      <div class="message">a beautiful day to begin ♡</div>
    </div>

    <svg
      class="botanical"
      viewBox="0 0 100 130"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <!-- Botanical stems -->
      <g
        fill="none"
        stroke="#B28F95"
        stroke-width="1.7"
        stroke-linecap="round"
      >
        <path d="M52 125 Q63 85 49 50 Q43 28 63 8"/>
        <path d="M55 94 Q32 79 21 61"/>
        <path d="M53 77 Q79 65 87 43"/>
        <path d="M49 54 Q31 47 28 29"/>
        <path d="M52 39 Q73 27 78 15"/>
      </g>

      <!-- Soft botanical leaves -->
      <g
        fill="#B28F95"
        fill-opacity="0.28"
        stroke="#B28F95"
        stroke-width="1"
      >
        <ellipse cx="21" cy="61" rx="4" ry="10"
          transform="rotate(-30 21 61)"/>
        <ellipse cx="32" cy="72" rx="4" ry="10"
          transform="rotate(35 32 72)"/>
        <ellipse cx="87" cy="43" rx="4" ry="10"
          transform="rotate(30 87 43)"/>
        <ellipse cx="74" cy="59" rx="4" ry="10"
          transform="rotate(-30 74 59)"/>
        <ellipse cx="28" cy="29" rx="4" ry="10"
          transform="rotate(-20 28 29)"/>
        <ellipse cx="39" cy="44" rx="4" ry="10"
          transform="rotate(30 39 44)"/>
        <ellipse cx="78" cy="15" rx="4" ry="10"
          transform="rotate(30 78 15)"/>
        <ellipse cx="65" cy="29" rx="4" ry="10"
          transform="rotate(-30 65 29)"/>
        <ellipse cx="63" cy="8" rx="4" ry="9"
          transform="rotate(10 63 8)"/>
      </g>
    </svg>

  </div>

  <script>
    function updateDate() {
      const now = new Date();

      const weekday = new Intl.DateTimeFormat("en-US", {
        weekday: "long"
      }).format(now);

      const date = new Intl.DateTimeFormat("en-US", {
        month: "short",
        day: "numeric"
      }).format(now);

      document.getElementById("weekday").textContent =
        weekday.toUpperCase();

      document.getElementById("date").textContent = date;
    }

    updateDate();

    // Refresh regularly so the date changes after midnight.
    setInterval(updateDate, 60 * 1000);
  </script>
</body>
</html>
