
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moonlit Rose Weather</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #F4F1EC;
    color: #775967;
    font-family: Georgia, serif;
  }

  .widget {
    padding: 24px 16px;
    text-align: center;
  }

  .heading {
    color: #B28F95;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .icon {
    font-size: 48px;
    margin: 15px 0 5px;
  }

  .temperature {
    font-size: 54px;
    line-height: 1.2;
  }

  .condition {
    font-size: 16px;
    margin-top: 8px;
  }

  .divider {
    height: 1px;
    width: 75%;
    background: #DDC6C4;
    margin: 20px auto 14px;
  }

  .location {
    color: #87838F;
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="widget">
  <div class="heading">☾ Today's Weather</div>
  <div class="icon" id="icon">☁</div>
  <div class="temperature" id="temperature">--°</div>
  <div class="condition" id="condition">
    Loading weather...
  </div>
  <div class="divider"></div>
  <div class="location" id="location"></div>
</div>

<script>
  // Change these three values for your city.
  const CITY = "Bogotá";
  const LATITUDE = 4.7110;
  const LONGITUDE = -74.0721;

  document.getElementById("location").textContent = CITY;

  function weatherDescription(code, isDay) {
    if (code === 0) return ["Clear sky", isDay ? "☀️" : "☾"];
    if (code <= 3) return ["Partly cloudy", "⛅"];
    if (code <= 48) return ["Foggy", "☁️"];
    if (code <= 67) return ["Rainy", "🌧️"];
    if (code <= 77) return ["Snowy", "❄️"];
    if (code <= 82) return ["Rain showers", "🌦️"];
    if (code <= 86) return ["Snow showers", "❄️"];
    if (code >= 95) return ["Thunderstorms", "⛈️"];
    return ["Cloudy", "☁️"];
  }

  async function updateWeather() {
    const url =
      "https://api.open-meteo.com/v1/forecast" +
      "?latitude=" + LATITUDE +
      "&longitude=" + LONGITUDE +
      "&current=temperature_2m,weather_code,is_day" +
      "&temperature_unit=celsius";

    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error("Weather unavailable");

      const data = await response.json();
      const current = data.current;

      const [description, icon] =
        weatherDescription(current.weather_code, current.is_day === 1);

      document.getElementById("temperature").textContent =
        Math.round(current.temperature_2m) + "°C";

      document.getElementById("condition").textContent = description;
      document.getElementById("icon").textContent = icon;
    } catch (error) {
      document.getElementById("condition").textContent =
        "Weather temporarily unavailable";
      document.getElementById("icon").textContent = "☁";
    }
  }

  updateWeather();
  setInterval(updateWeather, 15 * 60 * 1000);
</script>

</body>
</html>
